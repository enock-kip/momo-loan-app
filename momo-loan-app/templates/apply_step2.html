<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Application - Step 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
        .header-bar { background-color: #003366; padding: 12px 20px; }
        .step-bar { height: 5px; background: #e0e0e0; border-radius: 5px; }
        .step-active { background: #FFCC00; height: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header-bar d-flex justify-content-between align-items-center text-white">
        <a href="/apply/step1" class="text-white text-decoration-none">← Back</a>
        <div class="fw-bold bg-warning text-dark px-2 rounded">MM</div>
        <span>☰</span>
    </div>

    <div class="container d-flex justify-content-center my-4">
        <div class="card border-0 shadow-sm p-4" style="max-width: 480px; width: 100%; border-radius: 16px;">
            <h3 class="text-center fw-bold text-dark mb-1">Loan Application</h3>
            <p class="text-center text-muted small mb-3">Step 2 of 3</p>

            <div class="row g-1 mb-4">
                <div class="col-4"><div class="step-active"></div></div>
                <div class="col-4"><div class="step-active"></div></div>
                <div class="col-4"><div class="step-bar"></div></div>
            </div>

            <form action="/apply/step2" method="POST">
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label small fw-bold">First Name</label>
                        <input type="text" class="form-control" name="first_name" required>
                    </div>
                    <div class="col">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input type="text" class="form-control" name="last_name" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Phone Number (Uganda)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light">+256</span>
                        <input type="text" class="form-control" name="phone" placeholder="70123456" required>
                    </div>
                    <div class="form-text text-muted" style="font-size: 11px;">9 digits without +256 prefix</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="/apply/step1" class="btn btn-light w-50 py-3 fw-bold border">BACK</a>
                    <button type="submit" class="btn w-50 py-3 fw-bold text-white" style="background-color: #003366;">NEXT STEP</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
