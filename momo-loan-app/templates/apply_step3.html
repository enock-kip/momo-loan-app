<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Application - Step 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
        .header-bar { background-color: #003366; padding: 12px 20px; }
        .step-bar { height: 5px; background: #e0e0e0; border-radius: 5px; }
        .step-active { background: #FFCC00; height: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header-bar d-flex justify-content-between align-items-center text-white">
        <a href="/apply/step2" class="text-white text-decoration-none">← Back</a>
        <div class="fw-bold bg-warning text-dark px-2 rounded">MM</div>
        <span>☰</span>
    </div>

    <div class="container d-flex justify-content-center my-4">
        <div class="card border-0 shadow-sm p-4" style="max-width: 480px; width: 100%; border-radius: 16px;">
            <h3 class="text-center fw-bold text-dark mb-1">Loan Application</h3>
            <p class="text-center text-muted small mb-3">Step 3 of 3</p>

            <div class="row g-1 mb-4">
                <div class="col-4"><div class="step-active"></div></div>
                <div class="col-4"><div class="step-active"></div></div>
                <div class="col-4"><div class="step-active"></div></div>
            </div>

            <form action="/apply/step3" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Employment Status</label>
                    <select class="form-select" name="employment">
                        <option>Self-employed</option>
                        <option>Employed</option>
                        <option>Business Owner</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Annual Income (UGX)</label>
                    <input type="number" class="form-control" name="income" placeholder="33666999" required>
                </div>

                <div class="card bg-light border-0 p-3 mb-4">
                    <h6 class="fw-bold mb-2 small">Application Summary</h6>
                    <div class="d-flex justify-content-between small text-muted mb-1">
                        <span>Loan Amount:</span> <span class="fw-bold text-dark">UGX 1,000,000</span>
                    </div>
                    <div class="d-flex justify-content-between small text-muted mb-1">
                        <span>Loan Term:</span> <span class="fw-bold text-dark">48 Months</span>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="/apply/step2" class="btn btn-light w-50 py-3 fw-bold border">BACK</a>
                    <button type="submit" class="btn w-50 py-3 fw-bold text-white" style="background-color: #003366;">SUBMIT APPLICATION</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
