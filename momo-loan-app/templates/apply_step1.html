<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Application - Step 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
        .header-bar { background-color: #003366; padding: 12px 20px; }
        .step-bar { height: 5px; background: #e0e0e0; border-radius: 5px; }
        .step-active { background: #FFCC00; height: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header-bar d-flex justify-content-between align-items-center text-white">
        <a href="/" class="text-white text-decoration-none">← Back</a>
        <div class="fw-bold bg-warning text-dark px-2 rounded">MM</div>
        <span>☰</span>
    </div>

    <div class="container d-flex justify-content-center my-4">
        <div class="card border-0 shadow-sm p-4" style="max-width: 480px; width: 100%; border-radius: 16px;">
            <h3 class="text-center fw-bold text-dark mb-1">Loan Application</h3>
            <p class="text-center text-muted small mb-3">Step 1 of 3</p>

            <div class="row g-1 mb-4">
                <div class="col-4"><div class="step-active"></div></div>
                <div class="col-4"><div class="step-bar"></div></div>
                <div class="col-4"><div class="step-bar"></div></div>
            </div>

            <form action="/apply/step1" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Loan Type</label>
                    <select class="form-select" name="loan_type">
                        <option>Business Loan</option>
                        <option>Personal Loan</option>
                        <option>Emergency Loan</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Loan Amount (UGX)</label>
                    <input type="number" class="form-control" name="amount" value="1000000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Loan Term</label>
                    <select class="form-select" name="term">
                        <option>48 Months</option>
                        <option>24 Months</option>
                        <option>12 Months</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Purpose of Loan</label>
                    <textarea class="form-control" name="purpose" rows="2" placeholder="e.g. Business expansion" required></textarea>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold" style="background-color: #003366;">NEXT STEP</button>
            </form>
        </div>
    </div>
</body>
</html>
