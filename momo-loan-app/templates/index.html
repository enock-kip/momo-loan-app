<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTN MoMo Uganda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; font-family: sans-serif; }
        .header-bar { background-color: #003366; padding: 15px; text-align: center; border-bottom: 4px solid #FFCC00; }
        .momo-logo { background-color: #FFCC00; color: #003366; font-weight: 900; font-size: 24px; padding: 5px 15px; border-radius: 8px; display: inline-block; }
        .card-box { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .btn-momo { background-color: #003366; color: white; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="momo-logo">MM</div>
        <div class="text-white-50 small mt-1">from MTN</div>
    </div>

    <div class="container d-flex justify-content-center align-items-center my-4">
        <div class="card-box" style="max-width: 480px; width: 100%;">
            <h2 class="text-center fw-bold" style="color: #003366;">Welcome to MTN MoMo Uganda</h2>
            <p class="text-center text-muted mb-4">Get loans easily through MTN MoMo Uganda</p>

            <div class="card bg-light border-0 p-3 mb-4">
                <h6 class="fw-bold mb-3 text-dark">Loan Calculator</h6>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Amount</span>
                    <span class="fw-bold text-warning" id="displayAmount">UGX 1,000,000</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Term</span>
                    <span class="fw-bold text-warning">48 Months</span>
                </div>
                <input type="range" class="form-range" min="500000" max="5000000" step="100000" value="1000000" id="loanRange">
                <div class="d-flex justify-content-between text-muted small">
                    <span>UGX 500,000</span>
                    <span>UGX 5,000,000</span>
                </div>

                <div class="bg-white p-3 rounded mt-3 border">
                    <span class="text-muted small d-block">Monthly Payment</span>
                    <h3 class="fw-bold text-warning m-0" id="monthlyPayment">UGX 20,834</h3>
                </div>
            </div>

            <a href="/apply/step1" class="btn btn-momo w-100 py-3">START APPLICATION</a>
        </div>
    </div>

    <script>
        const range = document.getElementById('loanRange');
        const display = document.getElementById('displayAmount');
        const monthly = document.getElementById('monthlyPayment');
        range.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            display.innerText = "UGX " + val.toLocaleString();
            monthly.innerText = "UGX " + Math.round(val / 48).toLocaleString();
        });
    </script>
</body>
</html>
